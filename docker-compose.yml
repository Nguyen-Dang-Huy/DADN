services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: iot_smart_home
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./packages/web-backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: packages/web-backend/Dockerfile
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: iot_smart_home
      PORT: 3000
      MQTT_BROKER_URL: mqtts://io.adafruit.com:8883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_KEY: ${MQTT_KEY}
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: packages/web-frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  db_data:
    name: smart_home_db_data
